# Rejection-class fixture: well-formed on its own, but the paired mission
# fixture (see compiler.test.ts) declares a required output ('audit-log')
# that no stage here produces.
id: uncovered-output
version: 1
description: Single stage that does not produce every mission-required output.

entry_conditions:
  - "mission goal is a small, bounded change"

required_inputs:
  - "brief.md"

stages:
  - id: build
    role: worker
    type: implementation
    depends_on: []
    outputs: [candidate-diff]

required_outputs:
  - candidate-diff

terminal_condition: "build stage is DONE"
